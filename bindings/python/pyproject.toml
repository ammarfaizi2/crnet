# SPDX-License-Identifier: BSD-3-Clause
#
# pip install bindings/python  (from a crnet checkout)
#
# The version comes from include/crnet/crnet.h through setup.py.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crnet"
description = "HTTP and WebSocket client on Chromium's network stack (libcrnet bindings)"
license = "BSD-3-Clause"
requires-python = ">=3.8"
dynamic = ["version"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

[tool.setuptools]
packages = ["crnet"]
